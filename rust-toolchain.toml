[toolchain]
channel = "1.95.0"
components = ["rustfmt", "clippy"]
# Desktop targets only. The core pins Android and iOS cross-targets for the
# mobile shells; the desktop app never builds those, so they stay out here.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
