name: Build

# Cheap, fast per-push and per-PR check so a broken main is caught on the commit
# that caused it rather than on release day. Deliberately minimal, so it is never
# the reason someone skips pushing.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: test + clippy + fmt
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          # VaultPonyCore is a submodule; the workspace patch and the core crates
          # do not resolve without it.
          submodules: recursive

      - run: rustc --version && cargo --version

      # eframe needs these to LINK, not merely to run.
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libwayland-dev libgl1-mesa-dev

      - uses: Swatinem/rust-cache@v2

      # Scoped to this crate, not `--all`: `--all` descends into local path
      # dependencies and would enforce our formatting on the VaultPonyCore
      # submodule, whose formatting is that repository's concern. clippy and test
      # use `--workspace`, which covers only this workspace's members (the core is
      # excluded), so they do not have the same reach.
      - run: cargo fmt --check -p vaultpony-desktop
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # The same check the release asserts on every shipped artifact, run here so
      # a break is caught on the commit that caused it rather than on a tag.
      - name: selftest
        run: cargo run --release --bin vaultpony -- selftest
